version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      development-dependencies:
        dependency-type: "development"
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
    # typescript 7 has no compatible @typescript-eslint release yet
    # (typescript-eslint/typescript-eslint#12518) — revisit once TS 7.1's
    # stable compiler API ships.
    # graphql 17 has no compatible graphql-yoga release yet — graphql-yoga
    # 5.21.2 (latest stable) peer-caps graphql at ^15.2.0 || ^16.0.0, and
    # graphql-yoga 6 is alpha-only. Revisit once graphql-yoga 6 stabilizes.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
