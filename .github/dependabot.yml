version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      development-dependencies:
        dependency-type: "development"
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
    # typescript 7 has no compatible @typescript-eslint release yet
    # (typescript-eslint/typescript-eslint#12518) — revisit once TS 7.1's
    # stable compiler API ships.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
